name: Pull bundles
description: The flatpak bundles from their images in the registry.
inputs:
  images:
    description: 'image:tag references, as a JSON array'
    required: true
  platform:
    description: 'The image platform, for an image index'
    required: true
  path:
    description: 'Where to put the bundles'
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        PLATFORM: ${{ inputs.platform }}
        DEST: ${{ inputs.path }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        token=$(curl -sf -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
          "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY}:pull" | jq -r .token)
        get() {
          curl -sfL -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "$@"
        }
        mkdir -p "$DEST"
        for ref in $(jq -r '.[]' <<< "$IMAGES"); do
          url="https://ghcr.io/v2/${ref#ghcr.io/}"
          url="${url%:*}"
          manifest=$(get "$url/manifests/${ref##*:}")
          if jq -e .manifests <<< "$manifest" > /dev/null; then
            manifest=$(get "$url/manifests/$(jq -r --arg arch "${PLATFORM#linux/}" \
              '.manifests[] | select(.platform.architecture == $arch) | .digest' <<< "$manifest")")
          fi
          for layer in $(jq -r '.layers[].digest' <<< "$manifest"); do
            get "$url/blobs/$layer" | tar -xzf - -C "$DEST"
          done
        done
