name: Package

# One package: built and tested in the flatpak container for each architecture,
# then pushed from the runner, which has Docker, as an image tagged
# build-<fingerprint> holding the bundles of every architecture.
on:
  workflow_call:
    inputs:
      id:
        type: string
        required: true
      name:
        type: string
        required: true
      image:
        type: string
        required: true
      tag:
        type: string
        required: true
      version:
        type: string
        required: true
      arches:
        description: 'Flatpak architectures, as a JSON array'
        type: string
        required: true
      platforms:
        description: 'The same as image platforms'
        type: string
        required: true
      needs:
        description: 'Images of the packages it builds against, as a JSON array'
        type: string
        default: '[]'
      tests:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          [ "$(uname -m)" = "$ARCH" ] || { echo "::error::runner is $(uname -m), the build is for $ARCH"; exit 1; }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source checksums
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sources.json
          key: sources-${{ hashFiles('packages.json') }}
          restore-keys: sources-
      - name: Pull the packages it builds against
        if: inputs.needs != '[]'
        uses: ./.github/actions/pull-bundles
        with:
          images: ${{ inputs.needs }}
          path: needs
      # system installation, where the action's flatpak-builder --install-deps-from looks
      - name: Install the packages it builds against
        if: inputs.needs != '[]'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for bundle in needs/*-"$ARCH".flatpak; do
            flatpak install --system --noninteractive -y "$bundle"
          done
      - name: Generate the manifest
        env:
          ID: ${{ inputs.id }}
        run: ./generate.py "$ID"
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: build/${{ inputs.id }}.json
          bundle: ${{ inputs.id }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          run-tests: ${{ inputs.tests }}
          cache: false
          # below, kept for a day only
          upload-artifact: false
      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ inputs.id }}-${{ matrix.arch }}
          path: ${{ inputs.id }}-${{ matrix.arch }}.flatpak
          retention-days: 1

  push:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-${{ inputs.id }}-*
          merge-multiple: true
          path: bundle
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: type=raw,value=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ inputs.name }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.flatpak.id=${{ inputs.id }}
      # the same bundles for every platform: the layer is stored once
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bundle
          file: .github/bundle.Dockerfile
          platforms: ${{ inputs.platforms }}
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
